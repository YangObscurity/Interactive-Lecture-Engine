name: Auto Merge

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, labeled, unlabeled, synchronize]

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions: {}

jobs:
  decide:
    permissions:
      pull-requests: read
      issues: read
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft &&
      (
        github.event.pull_request.user.login == 'dependabot[bot]' ||
        contains(github.event.pull_request.labels.*.name, 'automerge') ||
        (github.event.action == 'unlabeled' && github.event.label.name == 'automerge')
      )
    outputs:
      action: ${{ steps.eval.outputs.action }}
      head_sha: ${{ github.event.pull_request.head.sha }}
      is_dependabot_auto: ${{ steps.eval.outputs.is_dependabot_auto }}
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ github.token }}

      - name: Evaluate auto-merge eligibility
        id: eval
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPO_OWNER: ${{ github.repository_owner }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          AUTHOR_ASSOC: ${{ github.event.pull_request.author_association }}
          PR_LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_LABEL: ${{ github.event.label.name }}
          DEP_ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          DEP_UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          set -euo pipefail

          # Only auto-enable Dependabot for non-major github-actions bumps (site/server npm still require maintainer review or `automerge` label).
          if [ "$PR_AUTHOR" = "dependabot[bot]" ] && [ "$DEP_ECOSYSTEM" = "github-actions" ] && [ "$DEP_UPDATE_TYPE" != "version-update:semver-major" ]; then
            echo "is_dependabot_auto=true" >> "$GITHUB_OUTPUT"
            echo "action=enable" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "is_dependabot_auto=false" >> "$GITHUB_OUTPUT"

          # Maintainer opt-in via `automerge` label on same-repo PRs (including dependabot[bot] npm bumps).
          has_label="$(jq -rn --argjson labels "$PR_LABELS_JSON" '$labels | index("automerge") != null')"
          if [ "$has_label" = "true" ]; then
            if [ "$PR_AUTHOR" != "dependabot[bot]" ]; then
              case "$AUTHOR_ASSOC" in
                OWNER|MEMBER|COLLABORATOR) ;;
                *)
                  echo "::notice::PR author association ($AUTHOR_ASSOC) is not eligible for automerge label"
                  echo "action=revoke" >> "$GITHUB_OUTPUT"
                  exit 0
                  ;;
              esac
            fi

            # Verify the latest actor who applied the `automerge` label on EVERY event.
            label_actor="$(gh api --paginate --slurp "repos/${GH_REPO}/issues/${PR_NUMBER}/events?per_page=100" | jq -r '[flatten(1)[] | select(.event == "labeled" and .label.name == "automerge")] | last | .actor.login // ""')"
            if [ "$PR_AUTHOR" = "dependabot[bot]" ]; then
              if [ -z "$label_actor" ] || [ "$label_actor" != "$REPO_OWNER" ]; then
                echo "::notice::Unauthorized automerge label actor (${label_actor:-unknown}) on dependabot PR; revoking label"
                echo "action=revoke" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            elif [ -z "$label_actor" ] || { [ "$label_actor" != "$REPO_OWNER" ] && [ "$label_actor" != "$PR_AUTHOR" ]; }; then
              echo "::notice::Unauthorized or unverifiable automerge label actor (${label_actor:-unknown}); revoking label"
              echo "action=revoke" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "action=enable" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT_ACTION" = "unlabeled" ] && [ "$EVENT_LABEL" = "automerge" ]; then
            echo "action=disable" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "action=none" >> "$GITHUB_OUTPUT"

  apply:
    needs: decide
    if: needs.decide.outputs.action != 'none'
    permissions:
      contents: write
      pull-requests: write
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: Update auto-merge state
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPO_OWNER: ${{ github.repository_owner }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ACTION: ${{ needs.decide.outputs.action }}
          HEAD_SHA: ${{ needs.decide.outputs.head_sha }}
          IS_DEP_AUTO: ${{ needs.decide.outputs.is_dependabot_auto }}
        run: |
          set -euo pipefail

          disable_auto_if_enabled() {
            local has_auto
            has_auto="$(gh pr view "$PR_NUMBER" --repo "$GH_REPO" --json autoMergeRequest --jq '.autoMergeRequest != null')"
            if [ "$has_auto" = "true" ]; then
              gh pr merge --repo "$GH_REPO" --disable-auto "$PR_NUMBER"
            fi
          }

          check_label_auth() {
            local author="$1"
            local assoc="$2"
            local events_json actor
            if [ "$author" != "dependabot[bot]" ]; then
              case "$assoc" in
                OWNER|MEMBER|COLLABORATOR) ;;
                *) return 1 ;;
              esac
            fi
            if ! events_json="$(gh api --paginate --slurp "repos/${GH_REPO}/issues/${PR_NUMBER}/events?per_page=100")"; then
              echo "::error::Failed to query label events for PR #$PR_NUMBER; aborting without modifying PR state" >&2
              return 2
            fi
            actor="$(printf '%s' "$events_json" | jq -r '[flatten(1)[] | select(.event == "labeled" and .label.name == "automerge")] | last | .actor.login // ""')"
            [ -n "$actor" ] || return 1
            if [ "$author" = "dependabot[bot]" ]; then
              [ "$actor" = "$REPO_OWNER" ]
            else
              [ "$actor" = "$REPO_OWNER" ] || [ "$actor" = "$author" ]
            fi
          }

          live_pr="$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}")"
          live_draft="$(printf '%s' "$live_pr" | jq -r '.draft')"
          live_head_sha="$(printf '%s' "$live_pr" | jq -r '.head.sha')"
          live_head_repo="$(printf '%s' "$live_pr" | jq -r '.head.repo.full_name // ""')"
          live_author="$(printf '%s' "$live_pr" | jq -r '.user.login')"
          live_assoc="$(printf '%s' "$live_pr" | jq -r '.author_association')"
          live_has_label="$(printf '%s' "$live_pr" | jq -r '[.labels[].name] | index("automerge") != null')"

          if [ "$ACTION" = "revoke" ]; then
            if [ "$live_has_label" != "true" ]; then
              echo "automerge label already absent on PR #$PR_NUMBER; skipping revoke"
              exit 0
            fi
            set +e
            check_label_auth "$live_author" "$live_assoc"
            auth_rc=$?
            set -e
            if [ "$auth_rc" -eq 0 ]; then
              echo "::notice::Live automerge label on PR #$PR_NUMBER is now authorized; keeping label"
              exit 0
            elif [ "$auth_rc" -ge 2 ]; then
              exit 1
            fi
            gh pr edit "$PR_NUMBER" --repo "$GH_REPO" --remove-label automerge
            disable_auto_if_enabled
            exit 0
          fi

          if [ "$ACTION" = "disable" ]; then
            if [ "$live_has_label" != "true" ] && [ "$IS_DEP_AUTO" != "true" ]; then
              disable_auto_if_enabled
            fi
            exit 0
          fi

          if [ "$live_draft" = "true" ] || [ "$live_head_repo" != "$GH_REPO" ] || [ "$live_head_sha" != "$HEAD_SHA" ]; then
            echo "::notice::PR #$PR_NUMBER live state changed (draft=$live_draft, head=$live_head_sha); skipping"
            exit 0
          fi

          if [ "$IS_DEP_AUTO" = "true" ]; then
            if [ "$live_author" != "dependabot[bot]" ]; then
              echo "::notice::PR #$PR_NUMBER author changed away from dependabot[bot]; skipping"
              exit 0
            fi
          else
            if [ "$live_has_label" != "true" ]; then
              echo "::notice::automerge label was removed before apply; disabling auto-merge"
              disable_auto_if_enabled
              exit 0
            fi
            set +e
            check_label_auth "$live_author" "$live_assoc"
            auth_rc=$?
            set -e
            if [ "$auth_rc" -ge 2 ]; then
              exit 1
            elif [ "$auth_rc" -ne 0 ]; then
              echo "::notice::Live automerge authorization failed on PR #$PR_NUMBER; revoking"
              gh pr edit "$PR_NUMBER" --repo "$GH_REPO" --remove-label automerge
              disable_auto_if_enabled
              exit 0
            fi
          fi

          state_json="$(gh pr view "$PR_NUMBER" --repo "$GH_REPO" --json autoMergeRequest,mergeStateStatus)"
          has_auto="$(printf '%s' "$state_json" | jq -r '.autoMergeRequest != null')"
          merge_state="$(printf '%s' "$state_json" | jq -r '.mergeStateStatus')"

          if [ "$has_auto" = "true" ]; then
            echo "Auto-merge already enabled for PR #$PR_NUMBER"
            exit 0
          fi

          if [ "$merge_state" = "CLEAN" ]; then
            gh pr merge --repo "$GH_REPO" --squash --match-head-commit "$HEAD_SHA" "$PR_NUMBER"
          else
            gh pr merge --repo "$GH_REPO" --auto --squash --match-head-commit "$HEAD_SHA" "$PR_NUMBER"
          fi
