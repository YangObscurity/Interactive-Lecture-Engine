name: Security Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: security-gates-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  opengrep:
    name: opengrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # opengrep-action forwards `severity` verbatim as `--severity=<enum>` (exact match, not minimum).
      # Surface WARNING findings as advisories, then strictly block PRs on ERROR findings.
      - id: scan-warning
        uses: platform-sec/opengrep-action@4c19a88ebb98ab9fb77993cb6d16b078740fad1e # v2.0.1
        with:
          target: .
          output-format: json/sarif
          severity: WARNING
          baseline-commit: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          strict: 'false'
      - id: scan-error
        uses: platform-sec/opengrep-action@4c19a88ebb98ab9fb77993cb6d16b078740fad1e # v2.0.1
        with:
          target: .
          output-format: json/sarif
          severity: ERROR
          baseline-commit: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          strict: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_CONFIG: .github/.gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: 'false'

  trivy:
    name: trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: '1'
