name: v2-ci

on:
  push:
    branches: [v2]
  pull_request:
    branches: [v2, main]

concurrency:
  group: v2-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: site

jobs:
  static:
    # PRs to main are only gated here when they come from v2.
    if: github.event_name != 'pull_request' || github.base_ref == 'v2' || github.head_ref == 'v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:legacy
      - run: npm run lint
      - run: npm test

  build-and-gates:
    if: github.event_name != 'pull_request' || github.base_ref == 'v2' || github.head_ref == 'v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build
      - name: check_figs2
        working-directory: .
        run: python scripts/check_figs2.py
      - name: 'check_body_links (exit code alone not trusted; require "结论: PASS")'
        working-directory: .
        run: |
          set -o pipefail
          python scripts/check_body_links.py | tee body_links.log
          grep -q "结论: PASS" body_links.log
      - name: check_lecture_contracts
        working-directory: .
        run: python scripts/check_lecture_contracts.py
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: site/docs/.vitepress/dist
          retention-days: 7

  e2e:
    needs: build-and-gates
    runs-on: ubuntu-latest
    env:
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: site/docs/.vitepress/dist
      - run: npx playwright install --with-deps chromium
      # prod project = `vitepress preview` of the downloaded dist (no rebuild).
      - run: npm run test:e2e -- --project=prod
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            site/playwright-report
            site/test-results
          retention-days: 7
