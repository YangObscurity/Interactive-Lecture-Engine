name: README Sync

on:
  push:
    branches: [v2, main]
  pull_request:
    branches: [v2, main]

concurrency:
  group: readme-sync-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  readme-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Check README style lock, links, and env parity
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$PR_BASE_SHA" ] && [ -n "$PR_HEAD_SHA" ]; then
            node scripts/check_readme_sync.mjs --base "$PR_BASE_SHA" --head "$PR_HEAD_SHA" --summary-file "$GITHUB_STEP_SUMMARY"
          elif [ "$EVENT_NAME" = "push" ] && [ -n "$PUSH_BEFORE_SHA" ] && [ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            node scripts/check_readme_sync.mjs --base "$PUSH_BEFORE_SHA" --head "$PUSH_AFTER_SHA" --summary-file "$GITHUB_STEP_SUMMARY"
          else
            node scripts/check_readme_sync.mjs --summary-file "$GITHUB_STEP_SUMMARY"
          fi
