        client_max_body_size 1m;
        proxy_pass http://lecture_legacy_backend;
    }

    # AI tool data (tools/*.json, _access/<tier>/tools/*.json): lecture-api reads it from disk (SITE_DIST_DIR);
    # browsers never need it, and the lecture file holds every lecture of a tier in one download.
    location ~ ^/(?:_access/[^/]+/)?tools/ {
        return 404;
    }

    # ---- Static site ----
    location / {
        auth_request /internal/authelia/authz;
        error_page 401 =302 https://auth.example.com/?rd=$target_url;
        try_files $uri $uri/ $uri.html =404;
    }
# ##### SERVER-LEVEL END #####
