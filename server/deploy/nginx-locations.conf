    # Dify custom tool endpoint (8099). Authelia is bypassed; a static token is checked instead.
    # The token lives in a file OUTSIDE the repository, e.g. /etc/nginx/secrets/lecture-tool-token.conf (chmod 640):
    #
    #   set $tool_auth_ok 0;
    #   if ($http_authorization = "Bearer REPLACE_WITH_TOOL_TOKEN") { set $tool_auth_ok 1; }
    #   if ($http_x_tool_token = "REPLACE_WITH_TOOL_TOKEN") { set $tool_auth_ok 1; }
    location /api/tool/ {
        auth_request off;
        include /etc/nginx/secrets/lecture-tool-token.conf;
        if ($tool_auth_ok = 0) {
            return 401 '{"code":401,"message":"Unauthorized"}\n';
        }

        # No identity for this location: blank all four headers so none can be injected.
        proxy_set_header Remote-User   "";
        proxy_set_header Remote-Groups "";
        proxy_set_header Remote-Email  "";
        proxy_set_header Remote-Name   "";

        # Other gateway presets: never pass them through.
