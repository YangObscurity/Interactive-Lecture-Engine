# =============================================================================
# lecture-api gateway template (single source for this site)
#
# Production layout: nginx -> Authelia forward auth -> lecture-api (127.0.0.1:8100),
# legacy Notion service (127.0.0.1:8099) and static files. See docs-dev/GATEWAY.md.
#
# The file has two sections, split by the marker lines below:
#   1. HTTP-LEVEL   : paste into the `http { }` block (or a conf.d file), NOT inside `server { }`.
#   2. SERVER-LEVEL : paste inside the `server { }` block of the site.
# `npm run auth:export -- --format nginx` prints the SERVER-LEVEL section verbatim, so the
# printed snippet cannot drift from this file. No secrets live here: the /api/tool/ token sits in
# an include file outside the repository (shape documented at that location).
#
# Rules enforced by server/tests/unit/nginx-template.test.ts:
#   - every location that proxies to 8100 or 8099 overwrites all four Remote-* headers
#     (from Authelia, or "" when there is no identity);
#   - every such location has auth_request, except `= /api/health` and `/api/tool/`;
#   - `/api/ai/` has `proxy_buffering off`.
# =============================================================================

# ##### HTTP-LEVEL BEGIN #####
upstream lecture_api_backend {
    server 127.0.0.1:8100;
    keepalive 32;
}

# Legacy Python service scripts/remote_server.py (Notion progress sync, Dify tool endpoint).
upstream lecture_legacy_backend {
    server 127.0.0.1:8099;
    keepalive 8;
}

# Extra cap for the AI proxy on top of the site-wide `docslimit` zone (defined elsewhere in http {}):
#   limit_req_zone $binary_remote_addr zone=docslimit:10m rate=...;   (already present on the site)
limit_req_zone $binary_remote_addr zone=lecture_ai:10m rate=30r/m;
# ##### HTTP-LEVEL END #####

# ##### SERVER-LEVEL BEGIN #####
    # Where Authelia sends logged-out users (change to your portal).
    set $target_url https://$host$request_uri;

    # ---- Authelia forward auth subrequest ----
    location /internal/authelia/authz {
        internal;
        proxy_pass http://127.0.0.1:9091/api/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_method HEAD;
        proxy_set_header X-Original-URL $target_url;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Method $request_method;
        proxy_set_header X-Forwarded-Uri $request_uri;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # lecture-api: progress, sessions, messages, checklists (logged-in users)
    location /api/db/ {
        modsecurity off;  # remove this line if the site does not use ModSecurity
        auth_request /internal/authelia/authz;
        auth_request_set $auth_user   $upstream_http_remote_user;
        auth_request_set $auth_groups $upstream_http_remote_groups;
        auth_request_set $auth_email  $upstream_http_remote_email;
        auth_request_set $auth_name   $upstream_http_remote_name;

        # Anti-spoofing: always overwrite the identity headers with what Authelia returned.
        proxy_set_header Remote-User   $auth_user;
        proxy_set_header Remote-Groups $auth_groups;
        proxy_set_header Remote-Email  $auth_email;
        proxy_set_header Remote-Name   $auth_name;

        # Other gateway presets: never pass them through.
        proxy_set_header X-Forwarded-User "";
        proxy_set_header X-Forwarded-Groups "";
        proxy_set_header X-Forwarded-Email "";
        proxy_set_header X-Forwarded-Preferred-Username "";
        proxy_set_header X-authentik-username "";
        proxy_set_header X-authentik-groups "";
        proxy_set_header X-authentik-email "";
        proxy_set_header X-authentik-name "";
        proxy_set_header X-Auth-Request-User "";
        proxy_set_header X-Auth-Request-Groups "";
        proxy_set_header X-Auth-Request-Email "";
        proxy_set_header X-Auth-Request-Preferred-Username "";
        proxy_set_header X-Auth-Request-Name "";

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 512k;
        proxy_pass http://lecture_api_backend;
    }

    # lecture-api: admin overview and health (the app checks the admin role; Authelia rules also limit it to admin groups)
    location /api/admin/ {
        auth_request /internal/authelia/authz;
        auth_request_set $auth_user   $upstream_http_remote_user;
        auth_request_set $auth_groups $upstream_http_remote_groups;
        auth_request_set $auth_email  $upstream_http_remote_email;
        auth_request_set $auth_name   $upstream_http_remote_name;

        # Anti-spoofing: always overwrite the identity headers with what Authelia returned.
        proxy_set_header Remote-User   $auth_user;
        proxy_set_header Remote-Groups $auth_groups;
        proxy_set_header Remote-Email  $auth_email;
        proxy_set_header Remote-Name   $auth_name;

        # Other gateway presets: never pass them through.
        proxy_set_header X-Forwarded-User "";
        proxy_set_header X-Forwarded-Groups "";
        proxy_set_header X-Forwarded-Email "";
        proxy_set_header X-Forwarded-Preferred-Username "";
        proxy_set_header X-authentik-username "";
        proxy_set_header X-authentik-groups "";
        proxy_set_header X-authentik-email "";
        proxy_set_header X-authentik-name "";
        proxy_set_header X-Auth-Request-User "";
        proxy_set_header X-Auth-Request-Groups "";
        proxy_set_header X-Auth-Request-Email "";
        proxy_set_header X-Auth-Request-Preferred-Username "";
        proxy_set_header X-Auth-Request-Name "";

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 4k;
        proxy_pass http://lecture_api_backend;
    }

