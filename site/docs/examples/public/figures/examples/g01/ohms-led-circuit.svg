<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="640" height="240">
  <rect x="0" y="0" width="640" height="240" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
  <!-- Power rail and return path (above the info card) -->
  <polyline points="80,126 80,60 185,60" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <polyline points="305,60 420,60" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />
  <polyline points="476,60 555,60 555,142 80,142 80,126" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Voltage source 3.3 V -->
  <circle cx="80" cy="100" r="28" fill="#ffffff" stroke="#2563eb" stroke-width="2.5" />
  <text x="80" y="96" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">VCC</text>
  <text x="80" y="113" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#1e293b">3.3 V</text>

  <!-- Series Current-Limiting Resistor -->
  <rect x="185" y="40" width="120" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5" />
  <text x="245" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1e3a8a">R = 150 Ω</text>
  <text x="245" y="74" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#475569">ΔU = 1.3 V</text>

  <!-- LED Diode -->
  <polygon points="420,38 420,82 468,60" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5" stroke-linejoin="round" />
  <line x1="472" y1="38" x2="472" y2="82" stroke="#dc2626" stroke-width="3" stroke-linecap="round" />
  <line x1="454" y1="30" x2="466" y2="16" stroke="#ea580c" stroke-width="2" stroke-linecap="round" />
  <line x1="468" y1="34" x2="480" y2="20" stroke="#ea580c" stroke-width="2" stroke-linecap="round" />
  <text x="446" y="106" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#991b1b">LED (Vf ≈ 2.0 V)</text>

  <!-- Loop current annotation -->
  <line x1="330" y1="46" x2="395" y2="46" stroke="#059669" stroke-width="2.5" />
  <polygon points="395,41 406,46 395,51" fill="#059669" />
  <text x="364" y="34" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#047857">I ≈ 8.7 mA</text>

  <!-- Bottom summary formula box -->
  <rect x="115" y="162" width="410" height="58" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
  <text x="320" y="185" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Safe Operating Point: P_R = (1.3 V)² / 150 Ω ≈ 11.3 mW</text>
  <text x="320" y="206" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Series resistor bounds nonlinear diode current below thermal limit</text>
</svg>
